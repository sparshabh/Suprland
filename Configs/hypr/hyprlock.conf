source = colors-hyprlock.conf

# BACKGROUND
background {
    monitor =
    path = ~/.cache/supr/current_wallpaper.jpg
    blur_passes = 3
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

# GENERAL
general {
    no_fade_in = false
    grace = 0
    disable_loading_bar = false
}

# Profie-Photo
image {
    monitor =
    path = ~/.config/supr/user/profile/user
    border_size = 2
    border_color = rgba(255, 255, 255, 0)
    size = 100
    rounding = -1
    rotate = 0
    reload_time = -1
    reload_cmd = 
    position = 0, -180
    halign = center
    valign = center
}

# Day-Month-Date
label {
    monitor =
    text = cmd[update:1000] echo -e "$(date +"%A, %B %d")"
    color = $primary 
    font_size = 25
    font_family = SF Pro Display Bold
    position = 0, 370
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = cmd[update:1000] echo "<span>$(date +"%I:%M")</span>"
    color = $primary 
    font_size = 95
    font_family = SF Pro Display Bold
    position = 0, 280
    halign = center
    valign = center
}

# USER-BOX
shape {
    monitor =
    size = 200, 45
    color = $surface_container_lowest 
    rounding = -1
    border_size = 0
    border_color = rgba(253, 198, 135, 0)
    rotate = 0
    xray = false # if true, make a "hole" in the background (rectangle of specified size, no rotation)

    position = 0, -275
    halign = center
    valign = center
}

# USER
label {
    monitor =
    text =     $USER
    color = $on_surface 
    outline_thickness = 2
    font_size = 12
    font_family = SF Pro Display Bold
    position = 0, -275
    halign = center
    valign = center
}

# INPUT FIELD
input-field {
    monitor =
    size = 200, 45
    outline_thickness = 2
    dots_size = 0.25 # Scale of input-field height, 0.2 - 0.8
    dots_spacing = 0.25 # Scale of dots' absolute size, 0.0 - 1.0
    dots_center = true
    outer_color = rgba(0, 0, 0, 0)
    inner_color = $surface_container_lowest 
    font_color = $primary 
    fade_on_empty = false
    font_family = SF Pro Display Bold
    placeholder_text = <i><span foreground="##ffffff99">Enter Password</span></i>
    hide_input = false
    position = 0, -335
    halign = center
    valign = center
}

